name: Terraform dev

on:
  workflow_dispatch:
    inputs:
      backend_image_tag:
        description: Existing ECR image tag to deploy (sha-<40 character commit SHA>)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infrastructure/environments/dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          role-session-name: github-actions-terraform-dev-plan
          aws-region: ap-northeast-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Check formatting
        run: terraform fmt -check

      - name: Validate configuration
        run: terraform validate

      - name: Plan changes
        env:
          BACKEND_IMAGE_TAG: ${{ inputs.backend_image_tag }}
        run: >-
          terraform plan
          -input=false
          -var="backend_image_tag=${BACKEND_IMAGE_TAG}"

  apply:
    name: Apply
    needs:
      - plan
    environment: dev-infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infrastructure/environments/dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          role-session-name: github-actions-terraform-dev-apply
          aws-region: ap-northeast-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Create approved plan
        env:
          BACKEND_IMAGE_TAG: ${{ inputs.backend_image_tag }}
        run: >-
          terraform plan
          -input=false
          -var="backend_image_tag=${BACKEND_IMAGE_TAG}"
          -out=dev.tfplan

      - name: Apply changes
        run: terraform apply -input=false dev.tfplan
