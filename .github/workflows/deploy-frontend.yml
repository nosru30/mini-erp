name: Deploy frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-frontend-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-frontend-deploy
          aws-region: ap-northeast-1

      - name: Upload versioned assets
        run: >-
          aws s3 sync dist "s3://${{ vars.FRONTEND_BUCKET_NAME }}"
          --delete
          --exclude "index.html"
          --cache-control "public,max-age=31536000,immutable"

      - name: Upload application shell
        run: >-
          aws s3 cp dist/index.html "s3://${{ vars.FRONTEND_BUCKET_NAME }}/index.html"
          --cache-control "no-cache,no-store,must-revalidate"
          --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
